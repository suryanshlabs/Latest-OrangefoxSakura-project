name: OrangeFox sakura R12.0 (manual production build)

# One production recovery build for Xiaomi Redmi 6 Pro (sakura), OrangeFox
# R12.0 / fox_12.1.
#
# RUNNER
# ------
# The expired ServerHive self-hosted runner is NOT used and must not be
# resurrected from here. `runner_label` selects the machine explicitly, so the
# workflow is usable on any real Linux x86_64 host you register, or on a
# GitHub larger runner, without editing the file.
#
# `ubuntu-latest` is the default only because it always exists; the preflight
# measures the actual disk and RAM and STOPS with an actionable error when the
# machine cannot hold a fox_12.1 sync (>=45 GB free, >=8 GB RAM). No doomed
# sync is ever started.
#
# Exactly one recoveryimage build is attempted per run. There is no diagnostic
# mode: static checks and the host probe run first and cost minutes.
#
# SECURITY
# --------
# Manual dispatch only (no pull_request / push trigger), contents: read, no
# secrets used or printed, builds serialised.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label for a Linux x86_64 host with >=45 GB free disk and >=8 GB RAM'
        type: string
        default: 'ubuntu-latest'
        required: true
      source_dir:
        description: 'Absolute or $HOME-relative OrangeFox tree (>=45 GB free). Reused when it already has .repo'
        type: string
        default: '$HOME/orangefox/fox_12.1'
        required: false
      parallel_jobs:
        description: 'Build jobs (0 = derive from measured RAM/CPU, capped at 8)'
        type: string
        default: '0'
        required: false
      reinstall_device_tree:
        description: 'Force-copy this repo device tree over the one in the source tree'
        type: boolean
        default: true
        required: false
      allow_missing_crypto:
        description: 'Build WITHOUT the vendor TEE chain (image cannot decrypt /data; for non-crypto work only)'
        type: boolean
        default: false
        required: false

concurrency:
  group: orangefox-sakura-build
  cancel-in-progress: false

permissions:
  contents: read

env:
  FOX_BRANCH: "12.1"
  DEVICE: sakura
  SYNC_SHA: 73d4d94e0d1b11b9035dea72ee223d25b1fefa7c
  MIN_DISK_GB: "45"
  MIN_MEM_MB: "7000"

jobs:
  preflight:
    name: Preflight (static checks + host capacity)
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 40
    outputs:
      source_dir: ${{ steps.res.outputs.source_dir }}
      disk_gb: ${{ steps.res.outputs.disk_gb }}
      mem_mb: ${{ steps.res.outputs.mem_mb }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Static regression checks
        shell: bash
        run: python3 tools/static_checks.py

      - name: Measure host capacity (hard gate)
        id: res
        shell: bash
        run: |
          set -uo pipefail
          SRC='${{ inputs.source_dir }}'
          SRC="${SRC/#\$HOME/$HOME}"
          echo "source_dir=$SRC" >> "$GITHUB_OUTPUT"

          echo "=== host ==="
          uname -a; uname -m; id
          echo "HOME=$HOME"; echo "PWD=$(pwd)"

          echo "=== cpu / load ==="
          nproc; grep -m1 'model name' /proc/cpuinfo || true
          echo "loadavg: $(cat /proc/loadavg)"

          echo "=== memory ==="
          free -h
          MEM_MAX=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
          if [ "$MEM_MAX" = "max" ] || [ -z "$MEM_MAX" ]; then
            mem_mb=$(( $(awk '/MemTotal/{print $2}' /proc/meminfo) / 1024 ))
          else
            mem_mb=$(( MEM_MAX / 1024 / 1024 ))
          fi
          echo "effective memory: ${mem_mb} MB"

          echo "=== disk ==="
          mkdir -p "$(dirname "$SRC")" 2>/dev/null || true
          df -h "$(dirname "$SRC")" || df -h
          DISK_GB=$(df -BG --output=avail "$(dirname "$SRC")" 2>/dev/null | tail -1 | tr -dc '0-9')
          echo "available for the source tree: ${DISK_GB:-0} GB"

          echo "disk_gb=${DISK_GB:-0}" >> "$GITHUB_OUTPUT"
          echo "mem_mb=$mem_mb" >> "$GITHUB_OUTPUT"

          fail=0
          if [ "${DISK_GB:-0}" -lt "$MIN_DISK_GB" ]; then
            echo "::error::Not enough disk: ${DISK_GB:-0} GB free at $(dirname "$SRC"), need >=${MIN_DISK_GB} GB."
            echo "::error::A fox_12.1 sync is ~45 GB and the build output needs room for ~60 GB total."
            echo "::error::Use a runner with a larger volume (set runner_label to your registered self-hosted host or a larger runner) and re-run."
            fail=1
          fi
          if [ "$mem_mb" -lt "$MIN_MEM_MB" ]; then
            echo "::error::Not enough RAM: ${mem_mb} MB, need >=${MIN_MEM_MB} MB (Soong will be OOM-killed)."
            fail=1
          fi
          exit "$fail"

      - name: Ensure JDK 11 (portable, no root required)
        shell: bash
        run: |
          set -euo pipefail
          JH="$(./build/setup_jdk11.sh)"
          echo "JAVA_HOME=$JH"
          "$JH/bin/java" -version 2>&1 | head -1

      - name: Require the core build toolchain
        shell: bash
        run: |
          set -uo pipefail
          CMDS="git curl python3 rsync unzip zip bc bison flex gcc g++ make ccache cpio lz4"
          missing() { for c in $CMDS; do command -v "$c" >/dev/null || echo "$c"; done; }
          M="$(missing)"
          if [ -n "$M" ]; then
            echo "::error::Missing build tools: $M"
            echo "::error::They need root once on this host: see documentation/DEPENDENCIES.md section 1."
            exit 1
          fi
          echo "core toolchain OK"

      - name: Host dependency preflight (build/check_deps.sh)
        shell: bash
        run: ./build/check_deps.sh --quick --dest '${{ inputs.source_dir }}'

  build:
    name: Sync, build and verify OrangeFox sakura
    needs: preflight
    runs-on: ${{ inputs.runner_label }}
    # A cold ~45 GB sync plus a 12.1 Soong build on a shared host.
    timeout-minutes: 900
    env:
      SRC: ${{ needs.preflight.outputs.source_dir }}
    steps:
      - name: Checkout this repository (device tree + tools)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure JDK 11 and export it
        shell: bash
        run: |
          set -euo pipefail
          JH="$(./build/setup_jdk11.sh)"
          {
            echo "JAVA_HOME=$JH"
            echo "ANDROID_JAVA_HOME=$JH"
          } >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
          "$JH/bin/java" -version 2>&1 | head -1

      - name: Ensure repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          if ! command -v repo >/dev/null; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
            chmod +x "$HOME/bin/repo"
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory '*' || true

      - name: Sync fox_12.1 (pinned) or reuse the existing tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$SRC/.repo" ]; then
            echo "=== cold sync into $SRC (the slow part) ==="
            ./build/sync.sh "$SRC"
          else
            echo "=== reusing existing tree at $SRC ==="
            ./build/sync.sh --relink-only "$SRC" 2>/dev/null || true
          fi

      - name: Install this repository's device tree
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.reinstall_device_tree }}' = 'true' ] || [ ! -d "$SRC/device/xiaomi/sakura" ]; then
            mkdir -p "$SRC/device/xiaomi/sakura"
            # --exclude keeps any already-fetched kernel blob in the tree.
            rsync -a --exclude 'prebuilt/Image.gz-dtb' \
                  "$GITHUB_WORKSPACE/device/xiaomi/sakura/" \
                  "$SRC/device/xiaomi/sakura/"
            echo "device tree installed"
          else
            echo "device tree already present; left untouched"
          fi

      - name: Ensure the verified sakura kernel
        shell: bash
        run: |
          set -euo pipefail
          K="$SRC/device/xiaomi/sakura/prebuilt/Image.gz-dtb"
          if [ -f "$K" ]; then
            echo "kernel present in tree:"; sha256sum "$K"
          else
            ./build/fetch_kernel.sh
          fi
          python3 tools/verify_dtb.py "$K"

      # The blobs are proprietary and are not in this repository. This step
      # installs them when the runner already has an extracted vendor_blobs/
      # set (build/extract_blobs.sh) and otherwise stops with instructions,
      # unless allow_missing_crypto was explicitly set for a no-decryption
      # build.
      - name: TEE blobs + decryption gate
        if: ${{ ! inputs.allow_missing_crypto }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f vendor_blobs/MANIFEST.sha256 ]; then
            ./build/install_blobs.sh
            # The device tree in $SRC was copied before the blobs existed, so
            # re-sync it now that recovery/root/system/{bin,lib64} and the
            # generated blob_install.mk are in place.
            rsync -a --exclude 'prebuilt/Image.gz-dtb' \
                  "$GITHUB_WORKSPACE/device/xiaomi/sakura/" \
                  "$SRC/device/xiaomi/sakura/"
          else
            echo "::error::No vendor_blobs/ on this runner: the QTI TEE chain was never extracted."
            echo "::error::These binaries are proprietary, so this repository cannot ship or download them."
            echo "::error::On a machine holding your sakura Android 9 stock fastboot ROM, run:"
            echo "::error::  ./build/extract_blobs.sh --firmware <fastboot ROM>.tgz"
            echo "::error::then make vendor_blobs/ available to this runner (or extract it there)."
            echo "::error::Or dispatch with allow_missing_crypto=true to build an explicitly no-decryption image."
            ./build/check_crypto_blobs.sh || true
            exit 1
          fi
          ./build/check_crypto_blobs.sh --require "$SRC"

      - name: Decryption gate (explicitly skipped)
        if: ${{ inputs.allow_missing_crypto }}
        shell: bash
        run: |
          echo "::warning::allow_missing_crypto=true - building an image that CANNOT decrypt /data."
          echo "::warning::Do not report FDE/FBE as working for this artefact."
          ./build/check_crypto_blobs.sh || true

      - name: Build recoveryimage (single production build)
        shell: bash
        run: |
          set -o pipefail
          OUT="$SRC/out/target/product/sakura"
          # A stale image must never be able to satisfy the verifier.
          rm -f "$OUT/OrangeFox-unofficial-sakura.img" "$OUT/recovery.img"
          if [ '${{ inputs.allow_missing_crypto }}' = 'true' ]; then
            export SAKURA_ALLOW_MISSING_CRYPTO=1
          fi
          PARALLEL_JOBS='${{ inputs.parallel_jobs }}' \
            ./build/build.sh "$SRC" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Verify the produced image (hard gate)
        shell: bash
        run: |
          set -o pipefail
          if [ '${{ inputs.allow_missing_crypto }}' = 'true' ]; then
            ./build/verify_image.sh "$SRC" 2>&1 | tee "$GITHUB_WORKSPACE/verify.log"
          else
            ./build/verify_image.sh "$SRC" --require-crypto 2>&1 | tee "$GITHUB_WORKSPACE/verify.log"
          fi
          exit "${PIPESTATUS[0]}"

      - name: Collect image, checksums, metadata and logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          OUT="$SRC/out/target/product/sakura"
          for f in OrangeFox-unofficial-sakura.img recovery.img; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" artifacts/ || true
          done
          for f in build.log verify.log errors.txt; do
            [ -f "$GITHUB_WORKSPACE/$f" ] && cp "$GITHUB_WORKSPACE/$f" artifacts/ || true
          done
          python3 tools/static_checks.py > artifacts/static-checks.log 2>&1 || true
          {
            echo "run:            $GITHUB_RUN_ID ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "commit:         $GITHUB_SHA"
            echo "runner_label:   ${{ inputs.runner_label }}"
            echo "fox branch:     $FOX_BRANCH (sync $SYNC_SHA)"
            echo "fox release:    $(grep -m1 FOX_BASE_VERSION "$(dirname "$SRC")/sync/orangefox_sync.sh" 2>/dev/null || echo 'unknown')"
            echo "device:         $DEVICE"
            echo "jobs:           ${{ inputs.parallel_jobs }} (0=auto)"
            echo "decryption:     $([ '${{ inputs.allow_missing_crypto }}' = 'true' ] && echo 'BUILT WITHOUT TEE CHAIN - cannot decrypt /data' || echo 'TEE chain required and gated') "
            echo "disk at start:  ${{ needs.preflight.outputs.disk_gb }} GB"
            echo "memory:         ${{ needs.preflight.outputs.mem_mb }} MB"
            echo
            echo "upstream revisions:"
            for p in bootable/recovery vendor/recovery vendor/twrp; do
              [ -d "$SRC/$p/.git" ] && echo "  $p $(git -C "$SRC/$p" rev-parse HEAD)"
            done
            [ -f "$SRC/device/xiaomi/sakura/prebuilt/Image.gz-dtb" ] && \
              echo "  kernel $(sha256sum "$SRC/device/xiaomi/sakura/prebuilt/Image.gz-dtb" | cut -d' ' -f1)"
            echo
            echo "sha256:"
            ( cd artifacts && sha256sum * 2>/dev/null )
          } > artifacts/BUILD_METADATA.txt
          cat artifacts/BUILD_METADATA.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
